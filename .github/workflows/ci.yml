name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/*"
      - "patch/*"

jobs:
  test-build-package:
    name: Test, Build, Package
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store release tooling
        run: python3 -B scripts/tests/test_store_release.py

      - name: Show Swift Version
        run: swift --version

      - name: AppKit Component E2E
        run: |
          echo "Real NSWindow/NSPanel AppKit component E2E is local-only on GitHub hosted macOS runners."
          echo "Run locally before shipping interactive changes:"
          echo "  swift test --filter HUDSizeControlTests"
          echo "  swift test --filter ImageWorkspacePanelControllerTests"
          echo "  swift test --filter ScreenshotDragItemProviderTests"

      - name: Test
        run: swift test --skip HUDSizeControlTests --skip ImageWorkspacePanelControllerTests --skip ScreenshotDragItemProviderTests

      - name: Build
        run: swift build

      - name: Package App
        run: scripts/package-app.sh

      - name: Verify App Bundle
        run: |
          test -d .build/app/dewShot.app
          test -x .build/app/dewShot.app/Contents/MacOS/dewShot
          plutil -lint .build/app/dewShot.app/Contents/Info.plist
          test "$(plutil -extract CFBundleDisplayName raw .build/app/dewShot.app/Contents/Info.plist)" = "dewShot"
          test "$(plutil -extract CFBundleIdentifier raw .build/app/dewShot.app/Contents/Info.plist)" = "dev.deweyou.dewshot"
          test "$(plutil -extract LSMinimumSystemVersion raw .build/app/dewShot.app/Contents/Info.plist)" = "26.0"
          codesign -dv .build/app/dewShot.app
