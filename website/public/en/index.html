<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Preview DewShot for Mac, get support, and read the privacy policy."
    />
    <title>DewShot · Screenshots and screen recording for Mac</title>
    <link rel="icon" href="/assets/dewshot-logo.svg" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="home">
    <main class="intro">
      <div class="identity">
        <h1>
          <img class="mark" src="/assets/dewshot-logo.svg" alt="" />
          <img
            class="wordmark"
            src="/assets/dewshot-wordmark.svg"
            alt="DewShot"
          />
        </h1>
        <p>A lightweight screenshot and screen recording tool for Mac</p>
      </div>
      <section class="gallery" aria-label="App preview">
        <div class="switcher" role="group" aria-label="Choose a preview">
          <label
            ><input type="radio" name="mode" value="capture" checked /><span
              >Region capture</span
            ></label
          >
          <label
            ><input type="radio" name="mode" value="record" /><span
              >Recording setup</span
            ></label
          >
        </div>
        <img
          class="capture"
          src="/assets/region-capture.png"
          alt="A selected region with the capture toolbar and size controls below it."
          width="1120"
          height="628"
        />
        <img
          class="record"
          src="/assets/recording-setup.png"
          alt="Recording setup with the start button, MP4 format, and input display options."
          width="1120"
          height="628"
        />
      </section>
    </main>
    <footer id="support">
      <a href="/en/privacy/">Privacy policy</a>
      <div class="preferences">
        <a
          href="/"
          lang="zh-CN"
          hreflang="zh-CN"
          title="切换到简体中文"
          aria-label="切换到简体中文"
          ><svg aria-hidden="true">
            <use href="/assets/preferences.svg#language"></use></svg
        ></a>
        <button type="button" class="theme-toggle" hidden>
          <svg aria-hidden="true">
            <use href="/assets/preferences.svg#moon"></use>
          </svg>
        </button>
        <a href="https://github.com/deweyou/frame" title="View DewShot on GitHub" aria-label="View DewShot on GitHub">
          <svg aria-hidden="true"><use href="/assets/preferences.svg#github"></use></svg>
        </a>
        <a class="support-email" href="mailto:deweyou97@gmail.com"
           title="Email support · deweyou97@gmail.com" aria-label="Email support · deweyou97@gmail.com">
          <svg aria-hidden="true"><use href="/assets/preferences.svg#mail"></use></svg>
        </a>
      </div>
    </footer>
  </body>
</html>
